<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seller Payout Account</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f3f3;
}

.container{
    max-width:700px;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h1{
    margin-bottom:25px;
    color:#232f3e;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

button{
    width:100%;
    padding:15px;
    background:#ff9900;
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#e68900;
}

#message{
    margin-top:20px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>Seller Payout Account</h1>

<form id="payoutForm">

<div class="form-group">
<label>Country</label>
<input
type="text"
id="country_code"
placeholder="Example: NA, US, GB"
required>
</div>

<div class="form-group">
<label>Payout Method</label>

<select id="payout_method">

<option value="Bank Account">Bank Account</option>

<option value="Debit Card">Debit Card</option>

<option value="Mobile Money">Mobile Money</option>

<option value="Digital Wallet">Digital Wallet</option>

</select>

</div>

<div class="form-group">
<label>Account Holder Name</label>
<input
type="text"
id="account_holder_name"
required>
</div>

<div class="form-group">
<label>Bank Name</label>
<input
type="text"
id="bank_name">
</div>

<div class="form-group">
<label>Account Number</label>
<input
type="text"
id="account_number">
</div>

<div class="form-group">
<label>Routing Number</label>
<input
type="text"
id="routing_number">
</div>

<div class="form-group">
<label>Sort Code</label>
<input
type="text"
id="sort_code">
</div>

<div class="form-group">
<label>IBAN</label>
<input
type="text"
id="iban">
</div>

<div class="form-group">
<label>SWIFT / BIC</label>
<input
type="text"
id="swift_bic">
</div>

<div class="form-group">
<label>Currency</label>
<input
type="text"
id="currency"
placeholder="USD, EUR, NAD"
required>
</div>

<button type="submit">
Save Payout Account
</button>

</form>

<p id="message"></p>

</div>

<script>

const token = localStorage.getItem("token");

if (!token) {
    window.location.href = "login.html";
}

document
.getElementById("payoutForm")
.addEventListener("submit", async (e) => {

    e.preventDefault();

    const data = {

        country_code:
        document.getElementById("country_code").value,

        payout_method:
        document.getElementById("payout_method").value,

        account_holder_name:
        document.getElementById("account_holder_name").value,

        bank_name:
        document.getElementById("bank_name").value,

        account_number:
        document.getElementById("account_number").value,

        routing_number:
        document.getElementById("routing_number").value,

        sort_code:
        document.getElementById("sort_code").value,

        iban:
        document.getElementById("iban").value,

        swift_bic:
        document.getElementById("swift_bic").value,

        currency:
        document.getElementById("currency").value

    };

    try {

        const response = await fetch("/seller-payout/add", {

            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },

            body: JSON.stringify(data)

        });

        const result = await response.json();

        const message = document.getElementById("message");

        message.innerText = result.message;

        // Only continue if the payout account was successfully saved
        if (response.ok) {

            // Give the seller a moment to see the success message
            setTimeout(() => {

                window.location.href = "withdraw.html";

            }, 1000);

        }

    } catch (error) {

        console.error("Payout account error:", error);

        document.getElementById("message").innerText =
            "Unable to save payout account. Please try again.";

    }

});
</script>

</body>
</html>
