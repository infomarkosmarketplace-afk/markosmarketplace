<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Seller Account</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f3f3;
        color: #111;
    }

    /* AMAZON-STYLE HEADER */
    .top-header {
        background: #131921;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .logo {
        color: white;
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 1px;
    }

    .logo span {
        color: #ff9900;
    }

    /* REGISTER CARD */
    .register-container {
        display: flex;
        justify-content: center;
        padding: 35px 15px;
    }

    .register-card {
        width: 100%;
        max-width: 450px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h1 {
        margin: 0 0 24px;
        font-size: 28px;
        font-weight: 500;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 6px;
    }

    input {
        width: 100%;
        height: 44px;
        padding: 10px 12px;
        border: 1px solid #888;
        border-radius: 4px;
        font-size: 15px;
        background: white;
    }

    input:focus {
        outline: none;
        border-color: #e77600;
        box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.25);
    }

    .password-help {
        font-size: 12px;
        color: #555;
        margin-top: 6px;
    }

    .register-button {
        width: 100%;
        height: 44px;
        border: 1px solid #a88734;
        border-radius: 4px;
        background: #ffd814;
        color: #111;
        font-size: 16px;
        cursor: pointer;
        margin-top: 8px;
    }

    .register-button:hover {
        background: #f7ca00;
    }

    .register-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .terms {
        font-size: 12px;
        line-height: 1.5;
        margin-top: 20px;
        color: #555;
    }

    .terms a {
        color: #0066c0;
        text-decoration: none;
    }

    .terms a:hover {
        text-decoration: underline;
    }

    .login-section {
        margin-top: 28px;
        padding-top: 22px;
        border-top: 1px solid #ddd;
        text-align: center;
    }

    .login-section p {
        margin: 0 0 12px;
        font-size: 14px;
        color: #555;
    }

    .login-button {
        display: block;
        width: 100%;
        padding: 11px;
        border: 1px solid #aaa;
        border-radius: 4px;
        background: #fff;
        color: #111;
        text-decoration: none;
        font-size: 15px;
    }

    .login-button:hover {
        background: #f7f7f7;
    }

    .message {
        display: none;
        padding: 12px;
        margin-bottom: 18px;
        border-radius: 4px;
        font-size: 14px;
    }

    .error-message {
        background: #ffe6e6;
        color: #b00020;
        border: 1px solid #ffb3b3;
    }

    .success-message {
        background: #e6f7e6;
        color: #176b17;
        border: 1px solid #a8d5a8;
    }

    @media (max-width: 500px) {
        .register-card {
            padding: 22px;
        }

        h1 {
            font-size: 24px;
        }
    }
</style>

</head><body><!-- HEADER -->
<header class="top-header">

    <div class="logo">
        Marko<span>'s</span> Marketplace
    </div>

</header>


<!-- REGISTER AREA -->
<main class="register-container">

    <div class="register-card">

        <h1>Create seller account</h1>


        <!-- ERROR MESSAGE -->
        <div
            id="errorMessage"
            class="message error-message">
        </div>


        <!-- SUCCESS MESSAGE -->
        <div
            id="successMessage"
            class="message success-message">
        </div>


        <form id="registerForm">


            <!-- NAME -->
            <div class="form-group">

                <label for="name">
                    Your name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Full name"
                    required
                >

            </div>


            <!-- EMAIL -->
            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PHONE NUMBER -->
            <div class="form-group">

                <label for="phone_number">
                    Phone number
                </label>

                <input
                    type="tel"
                    id="phone_number"
                    name="phone_number"
                    placeholder="+264 81 123 4567"
                    required
                >

            </div>


            <!-- PASSWORD -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 6 characters"
                    minlength="6"
                    required
                >

                <div class="password-help">
                    Password must be at least 6 characters.
                </div>

            </div>


            <!-- SELLER ROLE IS AUTOMATIC -->
            <input
                type="hidden"
                id="role"
                name="role"
                value="seller"
            >


            <!-- SUBMIT -->
            <button
                type="submit"
                id="registerButton"
                class="register-button"
            >
                Create seller account
            </button>


        </form>


        <p class="terms">

            By creating an account, you agree to
            Marko's Marketplace

            <a href="#">
                Terms of Use
            </a>

            and

            <a href="#">
                Privacy Notice
            </a>.

        </p>


        <!-- LOGIN -->
        <div class="login-section">

            <p>
                Already have an account?
            </p>

            <a
                href="login.html"
                class="login-button"
            >
                Sign in
            </a>

        </div>

    </div>

</main>


<!-- REGISTER JAVASCRIPT -->
<script src="js/register.js"></script>

</body></html>
